<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - WebSec Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      body { min-height: 100vh; background: radial-gradient(circle at top left, #eaf2ff 0, transparent 35%), #f4f7fb; display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
      .auth-card { width: 100%; max-width: 460px; border: 1px solid #e5e7eb; border-radius: 24px; box-shadow: 0 18px 45px rgba(15, 23, 42, .10); background: rgba(255,255,255,.96); overflow: hidden; }
      .auth-header { padding: 30px 28px 12px; text-align: center; }
      .brand-icon { width: 58px; height: 58px; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0d6efd, #084298); color: white; font-size: 25px; margin-bottom: 14px; }
      .auth-title { font-weight: 900; color: #172033; letter-spacing: -.4px; }
      .auth-subtitle { color: #667085; font-size: .92rem; }
      .form-control { padding: 12px 14px; border-radius: 14px; }
      .btn-primary { border-radius: 14px; padding: 12px; font-weight: 800; }
      .auth-footer { background: #f8fafc; border-top: 1px solid #e5e7eb; padding: 16px; text-align: center; }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon"><i class="fas fa-user-plus"></i></div>
        <h3 class="auth-title mb-1">Buat Akun</h3>
        <p class="auth-subtitle mb-0">Akun digunakan agar riwayat scan setiap pengguna tetap terpisah.</p>
      </div>
      <div class="p-4 pt-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Masukkan username" required autofocus />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" placeholder="email@domain.com" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Minimal 6 karakter" required />
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Konfirmasi Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Ulangi password" required />
          </div>
          <button type="submit" class="btn btn-primary w-100"><i class="fas fa-user-check me-1"></i> Daftar</button>
        </form>
      </div>
      <div class="auth-footer">
        <small class="text-muted">Sudah punya akun?</small>
        <a href="{{ url_for('main.login') }}" class="fw-bold text-decoration-none ms-1">Login</a>
      </div>
    </div>
  </body>
</html>
